<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Background -->
  <rect width="200" height="200" fill="#ffffff" rx="20"/>
  
  <!-- Outer pink heart shape (ribbon effect) -->
  <path d="M100 180 C30 130, 20 90, 20 70 C20 45, 35 35, 50 35 C60 35, 75 45, 100 65 C125 45, 140 35, 150 35 C165 35, 180 45, 180 70 C180 90, 170 130, 100 180" 
        fill="#FF1493" opacity="0.9"/>
  
  <!-- Inner pink heart (main) -->
  <path d="M100 175 C35 130, 25 95, 25 75 C25 50, 40 40, 55 40 C65 40, 78 48, 100 68 C122 48, 135 40, 145 40 C160 40, 175 50, 175 75 C175 95, 165 130, 100 175" 
        fill="#FF69B4"/>
  
  <!-- Ribbon band across heart -->
  <ellipse cx="100" cy="70" rx="35" ry="25" fill="none" stroke="#FF1493" stroke-width="15" opacity="0.7"/>
  
  <!-- Woman's profile silhouette -->
  <g fill="#FFFFFF">
    <!-- Head circle -->
    <circle cx="130" cy="65" r="22"/>
    
    <!-- Hair flowing -->
    <path d="M108 50 Q105 40, 115 38 Q125 35, 130 45 Q135 35, 145 40 Q155 45, 152 55 Q150 65, 140 70" fill="#FFFFFF"/>
    
    <!-- Face outline -->
    <ellipse cx="130" cy="70" rx="18" ry="20" fill="#FFFFFF"/>
    
    <!-- Nose -->
    <path d="M130 60 L128 75" stroke="#FF1493" stroke-width="2" fill="none"/>
    
    <!-- Lips -->
    <path d="M122 80 Q130 85, 138 80" stroke="#FF1493" stroke-width="1.5" fill="none"/>
    
    <!-- Eye -->
    <circle cx="125" cy="65" r="2" fill="#FF1493"/>
  </g>
  
  <!-- Sparkles around heart -->
  <g fill="#FFB6D9">
    <!-- Top left -->
    <path d="M50 50 L52 55 L57 57 L52 59 L50 64 L48 59 L43 57 L48 55 Z"/>
    <!-- Top right -->
    <path d="M160 45 L161 48 L164 49 L161 50 L160 53 L159 50 L156 49 L159 48 Z"/>
    <!-- Bottom left -->
    <path d="M45 130 L47 135 L52 137 L47 139 L45 144 L43 139 L38 137 L43 135 Z"/>
    <!-- Bottom right -->
    <path d="M155 140 L157 145 L162 147 L157 149 L155 154 L153 149 L148 147 L153 145 Z"/>
  </g>
</svg>